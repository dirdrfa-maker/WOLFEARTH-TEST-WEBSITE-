<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_14 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_14" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_14');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const pointLightRed = new THREE.PointLight(0xdc143c, 3, 50);
pointLightRed.position.set(10, 5, 5);
scene.add(pointLightRed);

const pointLightBlue = new THREE.PointLight(0x00bfff, 3, 50);
pointLightBlue.position.set(-10, -5, 5);
scene.add(pointLightBlue);

const spotLight = new THREE.SpotLight(0xffffff, 2);
spotLight.position.set(0, 10, 10);
spotLight.angle = Math.PI / 6;
spotLight.penumbra = 0.1;
scene.add(spotLight);

// Environment: Particles
const particlesCount = 2000;
const posArray = new Float32Array(particlesCount * 3);
for(let i=0; i < particlesCount * 3; i++) {
    posArray[i] = (Math.random() - 0.5) * 20;
}
const particlesGeo = new THREE.BufferGeometry();
particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
const particlesMat = new THREE.PointsMaterial({
    size: 0.015,
    color: 0xdc143c,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending
});
const particles = new THREE.Points(particlesGeo, particlesMat);
scene.add(particles);

// Abstract 3D Shapes (Floating Rings/Octahedrons)
const ringGeo = new THREE.TorusGeometry(8, 0.05, 16, 100);
const ringMat = new THREE.MeshPhongMaterial({ color: 0x3a3939, transparent: true, opacity: 0.3, wireframe: true });
const ring = new THREE.Mesh(ringGeo, ringMat);
scene.add(ring);

const octaGeo = new THREE.OctahedronGeometry(0.5);
const octaMat = new THREE.MeshStandardMaterial({ color: 0xdc143c, metalness: 0.8, roughness: 0.2 });
for(let i=0; i<15; i++) {
    const mesh = new THREE.Mesh(octaGeo, octaMat);
    mesh.position.set((Math.random()-0.5)*15, (Math.random()-0.5)*15, (Math.random()-0.5)*10 - 5);
    mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
    scene.add(mesh);
}

camera.position.z = 10;

// Animation
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth) - 0.5;
    mouseY = (e.clientY / window.innerHeight) - 0.5;
});

function animate() {
    requestAnimationFrame(animate);
    const time = Date.now() * 0.0005;

    particles.rotation.y = time * 0.1;
    ring.rotation.x = time * 0.2;
    ring.rotation.y = time * 0.1;

    // Camera Motion: Slow zoom and rotation
    camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
    camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;
    camera.lookAt(scene.position);

    const zoom = 8 + Math.sin(time) * 1;
    camera.position.z = zoom;

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_14 -->
</body>
</html>
